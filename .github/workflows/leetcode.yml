name: Sync LeetCode stats

# Refreshes public/leetcode.json so the site serves stats from its own origin.
on:
  schedule:
    - cron: '17 2 * * *' # 02:17 UTC nightly — off the hour to dodge peak load
  workflow_dispatch: {} # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch stats
        run: node scripts/fetch-leetcode.mjs
        env:
          LEETCODE_USERNAME: eeshadagar

      - name: Commit if changed
        run: |
          if git diff --quiet public/leetcode.json; then
            echo "No change today."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/leetcode.json
          git commit -m "chore: sync LeetCode stats"
          git push
